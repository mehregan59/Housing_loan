name: Offline tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: SQL migration and quota tests
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role;'
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/001_bot.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/002_shared_research.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/003_admin_quota.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/004_shared_reports.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/database.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/cache_database.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/admin_database.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/shared_database.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/pilot_database.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/budget_restart.sql
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/telegram/index.ts
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-strip-types tests/test_ui.mjs
